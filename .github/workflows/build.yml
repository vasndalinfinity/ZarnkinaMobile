name: Zarnkina Mobile Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false
      RELEASE_KEYSTORE_BASE64:
        required: false
      DEBUG_KEYSTORE_BASE64:
        required: false
      DEBUG_STORE_PASSWORD:
        required: false
      DEBUG_KEY_PASSWORD:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
      DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore signing keystores
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/zarnkina_mobile.jks
            echo "release keystore restored"
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/zarnkina_mobile_debug.jks
            echo "debug keystore restored"
          fi
          ls -l app/*.jks 2>/dev/null || echo "no keystore present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: on-failure

      - name: Build ${{ inputs.variant }} APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }} --no-daemon

      - name: Upload release APK
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: zarnkina-mobile-release-${{ matrix.arch }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release mapping
        if: inputs.variant == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: zarnkina-mobile-mapping-${{ matrix.arch }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Upload debug APK
        if: inputs.variant == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: zarnkina-mobile-debug-${{ matrix.arch }}
          path: app/build/outputs/apk/debug/*.apk
