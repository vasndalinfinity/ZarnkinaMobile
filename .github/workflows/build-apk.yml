name: Zarnkina Mobile APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm
          - arm64
          - x86
          - x86_64

jobs:
  build:
    name: Build ${{ inputs.arch }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/zarnkina_mobile_debug.jks
            echo "debug keystore restored"
          fi
          ls -l app/*.jks 2>/dev/null || echo "no keystore present"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -Darch=${{ inputs.arch }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zarnkina-mobile-debug-${{ inputs.arch }}
          path: app/build/outputs/apk/debug/*.apk
